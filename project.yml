
name: RoadForge

options:
  bundleIdPrefix: com.roadforge
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "RoadForge uses your location to show where you are on the map and provide navigation."
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "RoadForge uses location for navigation while you are driving."
    INFOPLIST_KEY_UIBackgroundModes: "location"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0

targets:
  RoadForge:
    type: application
    platform: iOS
    sources:
      - RoadForge
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadforge.app
        PRODUCT_NAME: RoadForge
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
