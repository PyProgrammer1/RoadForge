name: Build RoadForge iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project RoadForge.xcodeproj \
            -scheme RoadForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/RoadForge.app build/Payload/
          cd build
          zip -r RoadForge.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoadForge-unsigned-ipa
          path: build/RoadForge.ipa
          if-no-files-found: error
