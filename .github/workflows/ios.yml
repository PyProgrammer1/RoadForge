
name: Build RoadForge iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project RoadForge.xcodeproj \
            -scheme RoadForge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator app
        run: |
          mkdir -p artifacts/simulator
          cp -R build/simulator/Build/Products/Debug-iphonesimulator/RoadForge.app artifacts/simulator/

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: RoadForge-iOS-Simulator
          path: artifacts/simulator/RoadForge.app

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project RoadForge.xcodeproj \
            -scheme RoadForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/RoadForge.app artifacts/ipa/Payload/
          cd artifacts/ipa
          zip -r RoadForge.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RoadForge-unsigned-ipa
          path: artifacts/ipa/RoadForge.ipa
          if-no-files-found: error
